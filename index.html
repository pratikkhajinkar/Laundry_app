<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Friends Laundry & Dry Cleaners</title>
    <meta name="description" content="Professional mobile-first laundry pickup, delivery, automatic billing, WhatsApp invoice sharing, due payment collections, and shop cash settlements for Friends Laundry & Dry Cleaners." />
    <meta property="og:title" content="Friends Laundry & Dry Cleaners" />
    <meta property="og:description" content="Professional mobile-first laundry pickup, delivery, automatic billing, WhatsApp invoice sharing, due payment collections, and shop cash settlements for Friends Laundry & Dry Cleaners." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Runtime Environment: HMR disabled in iframe preview - ignore WebSocket and Firestore quota stream notices
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        var stack = reason ? (reason.stack || '') : '';
        if (
          msg.indexOf('WebSocket') !== -1 || 
          stack.indexOf('@vite/client') !== -1 ||
          msg.indexOf('RESOURCE_EXHAUSTED') !== -1 ||
          msg.indexOf('resource-exhausted') !== -1 ||
          msg.indexOf('Quota limit exceeded') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg.indexOf('WebSocket') !== -1 || 
          filename.indexOf('@vite/client') !== -1 ||
          msg.indexOf('RESOURCE_EXHAUSTED') !== -1 ||
          msg.indexOf('resource-exhausted') !== -1 ||
          msg.indexOf('Quota limit exceeded') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
